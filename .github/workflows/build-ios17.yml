name: Build iOS 17 IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner 池（arm64 拥堵时可换 macos-15-intel）'
        required: false
        default: 'macos-15'
        type: choice
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
          - macos-26

jobs:
  build:
    name: Build iOS 17 Unsigned IPA (${{ inputs.runner || 'macos-15' }})
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          uname -m
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selected: $NEWEST"
          sudo xcode-select -s "$NEWEST" || true
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project STV.xcodeproj -scheme STV

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry STV-ios17-unsigned.ipa Payload
          ls -lh STV-ios17-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios17-unsigned-${{ inputs.runner || 'macos-15' }}
          path: STV-ios17-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.runner || 'macos-15' }}
          path: build.log
