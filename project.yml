name: STV
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.69-6126ecae
  QuickJS:
    path: Packages/QuickJS
  AetherEngine:
    url: https://github.com/carrolltony930/AetherEngine
    branch: main
targets:
  STV:
    type: application
    platform: iOS
    sources:
      - STV
    dependencies:
      - package: TDLibKit
      - package: QuickJS
        product: CQuickJS
      - package: AetherEngine
        product: AetherEngine
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STV
      GENERATE_INFOPLIST_FILE: YES
      # 版本规则：每次功能更新 MARKETING_VERSION +0.1（1.6 → 1.7 → 1.8 …），
      # CURRENT_PROJECT_VERSION 同步 +1。TrollStore 靠 build 号判断覆盖安装，两个都要涨。
      # 2.0(17)：黄果线路自动发现 + /api/search 接口探测，修复「选到发布页导致点播放失败」。
      # 2.2(19)：黄果加密 HLS 强制走 HLSPlayback 自代理 key（修 -19152）；播放器去掉两侧
      # 快进/快退圆钮、缩小暂停键，报错时不再画中心按钮，错误文案改短中文。
      # 2.3(20)：加运行日志（Documents/stv.log，可见于「文件」App）+ 失败浮层显示 key/playlist
      # 真实结果，用于定位 -19152 到底卡在 403、超时还是没发请求。
      # 2.4(21)：AES key 改由 loopback http 提供（/k/<hex>），不再用自定义 scheme —— iOS 17
      # 对 stvkey:// 作 key URI 根本不发请求，必落 -19152。保留全部诊断日志。
      MARKETING_VERSION: "2.4"
      CURRENT_PROJECT_VERSION: "21"
      # 1.9(16)：HLSPlayback 的 finishLoading 需要 ObjC @try/@catch 包裹
      # （AVFCore 抛的是 Swift 捕获不到的 NSInternalInconsistencyException）。
      SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/STV/Playback/STV-Bridging-Header.h
      SWIFT_EMIT_LOC_STRINGS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: STV/Info.plist
      properties:
        CFBundleDisplayName: i短剧
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSFaceIDUsageDescription: 用于解锁「片源管理」里隐藏的长视频片源
        NSPhotoLibraryAddUsageDescription: 用于把你下载的图片和视频保存到相册
        LSApplicationQueriesSchemes: [tg]
        NSAppTransportSecurity:
          # 「阅读」书源: many novel sites are http-only. (NSAllowsLocalNetworking must not be set alongside:
          # iOS then ignores NSAllowsArbitraryLoads. Arbitrary loads already include the local proxy.)
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  STVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: STVTests
        excludes:
          - "Fixtures/Plugins/**"
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STVTests
  STVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - STVUITests
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STVUITests
      TEST_TARGET_NAME: STV
schemes:
  STV:
    build:
      targets:
        STV: all
        STVTests: [test]
        STVUITests: [test]
    test:
      targets:
        - STVTests
        - STVUITests
